appId: com.diskvision.app
productName: DiskSizer
directories:
  buildResources: resources
files:
  - out/**/*
  - package.json
  - build/Release/fast_readdir.node
asarUnpack:
  - build/Release/fast_readdir.node
  - node_modules/sqlite3/**
npmRebuild: false
win:
  executableName: DiskSizer
  target:
    - target: nsis
      arch:
        - x64
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: DiskSizer
  uninstallDisplayName: DiskSizer
  createDesktopShortcut: always
